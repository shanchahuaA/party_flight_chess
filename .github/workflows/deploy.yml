name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 规则内核单测（#17 起建立的首个测试集）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kernel/package-lock.json
      - run: npm ci
        working-directory: kernel
      - run: npm test
        working-directory: kernel

  # GitHub Pages：构建 client（Vite+Vue3）并部署
  pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
      - id: deployment
        uses: actions/deploy-pages@v4

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
        working-directory: server
      # wrangler.jsonc 的 assets 指 ../client/dist——部署前必须先构建 client（#46 T9）
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - id: guard
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "has_token=$([[ -n "$CF_TOKEN" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.has_token != 'true'
        run: echo "::notice::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过 Worker 部署；配好 Secrets 后重新运行本 workflow 即可"
      - if: steps.guard.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: server
          command: deploy
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
